<!DOCTYPE html>
<!--
  Visor de patrimonio 3D · Incremento 3: exploración interactiva.

  En desarrollo (npm run dev) se abre en http://localhost:5173/ y necesita el
  servidor Python en marcha (puerto 8000). Una vez publicado (npm run build),
  la sirve el propio servidor Python en http://localhost:8000/.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor de patrimonio 3D</title>
  <link rel="stylesheet" href="/src/estilos.css">
</head>
<body class="pagina-visor">
  <!-- Aquí dibuja EscenaGrafo (lienzo WebGL, capa de etiquetas y etiqueta flotante). -->
  <div id="contenedor3d" class="contenedor-3d"></div>

  <!--
    Capa de la interfaz 2D, por encima de la escena. InterfazUsuario monta
    cada componente en su zona (data-zona). El centro queda libre para la
    vista 3D: la capa no captura el ratón salvo en sus paneles.
  -->
  <div id="interfaz" class="interfaz">
    <header class="zona-superior barra-superior" data-zona="superior">
      <h1>Visor de patrimonio 3D</h1>
    </header>
    <div class="zona-izquierda" data-zona="izquierda"></div>
    <div class="zona-derecha" data-zona="derecha"></div>
    <footer class="zona-inferior">
      <div class="zona-estado" data-zona="estado"></div>
      <!-- La rellena Aplicacion (barra de rendimiento). -->
      <div class="barra-rendimiento" aria-label="Rendimiento">
        <span id="rendimientoGrafo">Sin grafo</span>
        <span id="rendimientoFps">— fps</span>
        <span id="rendimientoEstabilizacion"></span>
        <span id="rendimientoCalculo"></span>
        <span id="rendimientoDatos"></span>
      </div>
    </footer>
  </div>

  <!-- Aviso si la página no puede arrancar (por ejemplo, sin servidor). -->
  <div id="avisoArranque" class="aviso-arranque" role="alert" hidden></div>

  <!-- Vite carga main.js como módulo; main.js importa todo lo demás. -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
