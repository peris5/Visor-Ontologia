<!DOCTYPE html>
<!--
  Visor de patrimonio 3D · Incremento 2: visualización 3D.

  En desarrollo (npm run dev) se abre en http://localhost:5173/ y necesita el
  servidor Python en marcha (puerto 8000). Una vez publicado (npm run build),
  la sirve el propio servidor Python en http://localhost:8000/.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor de patrimonio 3D</title>
  <link rel="stylesheet" href="/src/estilos.css">
</head>
<body class="pagina-visor">
  <!-- Aquí dibuja EscenaGrafo (lienzo WebGL y capa de etiquetas). -->
  <div id="contenedor3d" class="contenedor-3d"></div>

  <!-- Controles temporales: en el incremento 3 se sustituyen por el buscador. -->
  <header class="barra-superior">
    <h1>Visor de patrimonio 3D</h1>
    <div class="control">
      <label for="selectorEntidad">Entidad central</label>
      <select id="selectorEntidad"></select>
    </div>
    <div class="control">
      <label for="deslizadorUmbral">Umbral de relevancia: <span id="valorUmbral"></span></label>
      <input type="range" id="deslizadorUmbral" min="0" max="1" step="0.05">
    </div>
    <button type="button" id="botonVistaInicial">Vista inicial</button>
  </header>

  <!-- La Leyenda se monta aquí desde main.js. -->
  <div id="panelIzquierdo" class="panel-izquierdo"></div>

  <div id="indicadorCarga" class="indicador-carga" hidden>Cargando…</div>
  <div id="avisoError" class="aviso-error" role="alert" hidden></div>

  <footer class="barra-estado">
    <span id="estadoGrafo">Sin grafo</span>
    <span id="estadoFps">— fps</span>
    <span id="estadoEstabilizacion"></span>
  </footer>

  <!-- Vite carga main.js como módulo; main.js importa todo lo demás. -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
